<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" 
 content="default-src 'self'; img-src 'self' data:; style-src 'self'
  'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self' ">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórial de Órdenes - Laboratorio</title>

    <!-- Bootstrap CSS local -->
    <link href="../public/lib/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons local -->
    <link href="../public/lib/bootstrap-icons.css" rel="stylesheet">
    <!-- Select2 CSS local -->
    <link href="../public/lib/select2.min.css" rel="stylesheet">
    <!-- Select2 Theme Bootstrap 5 local -->
    <link href="../public/lib/select2-bootstrap-5-theme.min.css" rel="stylesheet">

    <link href="../public/css/styles.css" rel="stylesheet">
</head>
<body class="pagina-historial">
<nav class="navbar navbar-dark bg-primary shadow-sm mb-4 no-imprimir">
    <div class="container">
       <span class="navbar-brand mb-0 h1">
            <img src="../public/imagen/portada.png" alt="Logo" class="logo-navbar me-2">
            MiroLab Systems
            <span class="navbar-text">-Demo Version 1</span>
        </span>
        <div class="d-flex align-items-center">
            <span class="text-white small no-imprimir"><i class="bi bi-calendar3 me-1"></i> <span id="fechaHoy"></span></span>
        </div>
    </div>
</nav>

<div class="mb-3 no-imprimir">
    <button class="btn btn-volver" onclick="window.location.href='../index.html'">
        <i class="bi bi-arrow-left me-1"></i> Volver a Recepción
    </button>
</div>

<div class="container mb-4">
    <h3><i class="bi bi-clock-history me-2"></i> Historial </h3>
    <p class="text-muted">Pacientes y todas sus visitas (orden actual y anteriores).</p>

    <!-- Buscador de pacientes -->
    <div class="card shadow-sm mb-3 no-imprimir"> 
        
        <div class="card-body">
            <label class="form-label fw-semibold">Buscar paciente:</label>
            <div class="row g-2 align-items-end" style="max-width: 760px;">
                <div class="col-sm-7">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" id="buscadorHistorial" class="form-control" placeholder="Nombre, cédula u orden...">
                    </div>
                </div>
                <div class="col-sm-3">
                    <label for="fechaFiltroHistorial" class="form-label small mb-1 text-muted">Fecha</label>
                    <input type="date" id="fechaFiltroHistorial" class="form-control">
                </div>
                <div class="col-sm-2">
                    <button class="btn btn-outline-secondary w-100" type="button" onclick="window.limpiarBusquedaHistorial()">
                        <i class="bi bi-x-lg"></i> Limpiar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-list-ol me-2"></i> Órdenes del historial</span>
            <span class="badge bg-light text-primary" id="totalOrdenesHistorial">0 órdenes</span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Orden</th>
                            <th>Paciente</th>
                            <th>Cédula</th>
                            <th>Fecha</th>
                            <th class="text-center">Visitas</th>
                            <th class="text-center">Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaHistorial">
                        <tr>
                            <td colspan="7" class="text-center text-muted py-4">Cargando órdenes...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center px-3 py-2 bg-light border-top no-imprimir">
                <button id="btnAnteriorHistorial" class="btn btn-sm btn-outline-secondary" disabled>
                    <i class="bi bi-chevron-left me-1"></i>Anterior
                </button>
                <span class="text-muted small">Página <span id="paginaActualHistorial">1</span></span>
                <button id="btnSiguienteHistorial" class="btn btn-sm btn-outline-secondary" disabled>
                    Siguiente <i class="bi bi-chevron-right ms-1"></i>
                </button>
            </div>
        </div>
    </div>
</div>


 <!-- Bootstrap JS local -->
<script src="../public/lib/jquery-3.6.0.min.js"></script>
<script src="../public/lib/bootstrap.bundle.min.js"></script>
<script src="../public/js/tooltips.js"></script>
<!-- Select2 JS local -->
<script src="../public/lib/select2.min.js"></script>
<!-- jsPDF y autoTable para generar PDFs -->
<script src="../public/lib/jspdf.umd.min.js"></script>
<script src="../public/lib/jspdf.plugin.autotable.min.js"></script>
<script src="../public/js/db-catalogo.js"></script>
<script src="../public/js/calculos.js"></script>
<script src="../public/js/hematologia.js"></script>
<script src="../public/js/uroanalisis.js"></script>
<script src="../public/js/uroanalisis-form.js"></script>
    <script src="../public/js/secrecion-vaginal.js"></script>
    <script src="../public/js/heces-form.js"></script>
    <script src="../public/js/heces.js"></script>
<script src="../public/js/frotis.js"></script>
<script src="../public/js/perfiles-modal.js"></script>
<script src="../public/js/items-detallados.js"></script>
<script src="../public/js/utils.js"></script>
<script src="../public/js/storage.js"></script>
<script src="../public/js/pdf.js"></script>
<script src="../public/js/historial.js"></script>
<script src="../public/js/notifications.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        window.mostrarFechaHoy();
        // El catálogo vive en SQLite: se espera a db-catalogo.js antes de leerlo.
        var iniciar = function() { window.initHistorial(); };
        if (window.catalogoListo) {
            window.catalogoListo.then(iniciar, iniciar);
        } else {
            iniciar();
        }
    });
</script>






</body>
</html>
