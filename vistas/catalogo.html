                <i class="bi bi-arrow-left me-1"></i> Volver a Recepción
            </button>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-journal-medical me-2"></i> Catálogo de Exámenes</span>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary btn-sm" onclick="toggleAllCatalogoSections(false)">
                        <i class="bi bi-arrows-collapse me-1"></i> Colapsar Todo
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="toggleAllCatalogoSections(true)">
                        <i class="bi bi-arrows-expand me-1"></i> Expandir Todo
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="restablecerCatalogo()">
                        <i class="bi bi-arrow-counterclockwise me-1"></i> Restablecer
                    </button>
                    <button class="btn btn-success btn-sm" onclick="guardarCatalogo()">
                        <i class="bi bi-save me-1"></i> Guardar Cambios
                    </button>
                </div>
            </div>
            <div class="card-body p-0">
                <div id="catalogoAcordeones">
                    <div class="text-center text-muted py-4">Cargando catálogo...</div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header">
                <i class="bi bi-collection-play me-2"></i> Perfiles / Paneles
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th width="30%">Nombre del Perfil</th>
                                <th width="60%">Exámenes Incluidos</th>
                                <th width="10%" class="text-center">Cantidad</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCatalogoPerfiles">
                            <tr>
                                <td colspan="3" class="text-center text-muted py-4">Cargando perfiles...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
